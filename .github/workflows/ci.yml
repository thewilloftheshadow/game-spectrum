name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        types: [opened, synchronize]
    merge_group:

jobs:
    ci:
        name: Check - ${{ matrix.command }}
        timeout-minutes: 15
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                command:
                    - bun run lint:check
                    - bun run format:check
                    - bun run typecheck
                    - bun run build
        steps:
            - uses: oven-sh/setup-bun@v2

            - uses: actions/checkout@v4

            - name: Install dependencies
              run: bun install

            - name: Run check
              run: ${{ matrix.command }}
